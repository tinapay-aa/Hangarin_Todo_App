{% extends "base.html" %}
{% load static %}


{% block title %}Add Sub-Task{% endblock %}

{% block content %}
<div class="form-container">
    <form action="" method=POST>
        <span>
        <h1>Create Task</h1>
        <a id="back-button" href="/?{{ query_params }}">Go back</a>
        </span>
        {% csrf_token %}
        {{ form.as_p }}

        <input id="submit-button" type="submit">
    </form>
</div>
{% endblock %}
